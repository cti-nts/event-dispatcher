name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=semver,pattern={{major}}.{{minor}}
          # type=semver,pattern={{major}}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        run: |
          set -e

          # Initialize the environment
          echo "Initializing environment..."
          bin/init

          # Build the image
          echo "Building Docker image..."
          bin/env prod build

          # Find the built image
          BUILT_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep event-dispatcher | head -1)

          if [[ -z "$BUILT_IMAGE" ]]; then
            echo "Error: Could not find built image with 'event-dispatcher' in name"
            echo "Available images:"
            docker images
            exit 1
          fi

          echo "Built image: $BUILT_IMAGE"

          # Extract tags from metadata
          TAGS="${{ steps.meta.outputs.tags }}"
          echo "Target tags: $TAGS"

          # Tag and push each tag
          for tag in $TAGS; do
            echo "Tagging $BUILT_IMAGE as $tag"
            docker tag $BUILT_IMAGE $tag
            echo "Pushing $tag"
            docker push $tag
          done

          echo "Successfully pushed all tags"

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"
